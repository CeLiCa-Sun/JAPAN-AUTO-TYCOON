name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency lockfile if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          test -s package-lock.json
      - name: Install dependencies from resolved lockfile
        run: npm ci
      - name: Upload resolved lockfile for repository pinning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: ignore
      - name: Audit dependency vulnerabilities (report only)
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const fs=require("fs");try{const a=JSON.parse(fs.readFileSync("npm-audit.json","utf8"));for(const [name,v] of Object.entries(a.vulnerabilities||{})){console.log(name+" severity="+v.severity+" range="+v.range+" fix="+JSON.stringify(v.fixAvailable))}console.log("audit-counts",JSON.stringify(a.metadata?.vulnerabilities||{}));}catch(e){console.log("Audit report unavailable:",String(e));}'
        continue-on-error: true
      - name: Upload dependency audit details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-details
          path: npm-audit.json
          if-no-files-found: ignore
      - name: Display resolved build and testing dependencies
        run: npm ls vite vitest @vitest/mocker
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Chromium desktop/mobile and Firefox/WebKit E2E
        run: npm run test:e2e
      - name: Dependency vulnerability gate (moderate and higher)
        if: always()
        run: npm audit --audit-level=moderate
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Commit CI-generated verified lockfile
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-files --error-unmatch package-lock.json > /dev/null 2>&1; then
            echo 'A versioned lockfile already exists.'
            exit 0
          fi
          cp package-lock.json /tmp/jat-tested-package-lock.json
          manifest_sha="$(sha256sum package.json | cut -d' ' -f1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            latest_manifest="$(git show FETCH_HEAD:package.json | sha256sum | cut -d' ' -f1)"
            if [ "$manifest_sha" != "$latest_manifest" ]; then
              echo 'package.json changed after testing; refusing to commit a stale lockfile.'
              exit 1
            fi
            if git cat-file -e FETCH_HEAD:package-lock.json 2>/dev/null; then
              echo 'A lockfile was already committed by another writer.'
              exit 0
            fi
            git checkout -B verified-lockfile FETCH_HEAD
            cp /tmp/jat-tested-package-lock.json package-lock.json
            git add package-lock.json
            git commit -m 'chore(deps): preserve audited and tested npm lockfile [skip ci]'
            if git push origin HEAD:main; then
              echo 'Verified lockfile committed to the latest main.'
              exit 0
            fi
            echo "Retrying lockfile push ($attempt)..."
            sleep 2
          done
          exit 1
      - name: Publish phase CI status for SHA-based verification
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'JAPAN AUTO TYCOON / CI',
              description: 'Build, Vitest, four-browser E2E, moderate+ npm audit',
              target_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });

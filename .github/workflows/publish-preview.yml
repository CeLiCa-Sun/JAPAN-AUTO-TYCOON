name: Publish playable preview

# Deployment is explicitly owner-initiated after Pages has been enabled in Settings.
# The previous push-triggered release failed when the repository had no Pages site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-playable-preview
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require GitHub Pages to be enabled from Actions
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              if (response.data.build_type !== 'workflow') {
                core.setFailed('Pages is not using GitHub Actions. Open Settings > Pages > Build and deployment > Source: GitHub Actions.');
              }
            } catch (error) {
              if (error.status === 404) {
                core.setFailed('GitHub Pages has not been enabled. Repository admin: open Settings > Pages, select GitHub Actions as the deployment source, and verify private-repository plan eligibility.');
              } else {
                throw error;
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require committed and reproducible lockfile
        run: |
          git ls-files --error-unmatch package-lock.json
          test -s package-lock.json
      - name: Install verified dependencies
        run: npm ci
      - name: Block publication if high or critical advisories are present
        run: |
          npm ls vite vitest @vitest/mocker
          npm audit --audit-level=moderate
      - name: Build for GitHub Pages repository path
        run: npm run build -- --mode pages
      - name: Unit tests
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Full PC/mobile browser smoke and regression tests
        run: npm run test:e2e
      - name: Verify built output
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/JAPAN-AUTO-TYCOON/assets/' dist/index.html
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      statuses: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish approved preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test live site and primary JavaScript
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${DEPLOYED_URL%/}/"
          echo "Checking published Pages response: $url"
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "$url" -o /tmp/jat-public-index.html
          grep -q 'JAPAN AUTO TYCOON' /tmp/jat-public-index.html
          script="$(grep -o 'src="/JAPAN-AUTO-TYCOON/assets/[^"]*"' /tmp/jat-public-index.html | head -1 | cut -d'"' -f2)"
          test -n "$script"
          host="${url%%/JAPAN-AUTO-TYCOON/*}"
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${host}${script}" -o /tmp/jat-public-app.js
          test -s /tmp/jat-public-app.js
      - name: Record Pages success or failure on commit
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.DEPLOY_STATUS === 'success' ? 'success' : 'failure',
              context: 'JAPAN AUTO TYCOON / Pages',
              description: process.env.DEPLOY_STATUS === 'success' ? 'Live HTML and JavaScript smoke passed' : 'Pages publication or live smoke failed',
              target_url: process.env.DEPLOY_STATUS === 'success' ? process.env.DEPLOYED_URL : 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });

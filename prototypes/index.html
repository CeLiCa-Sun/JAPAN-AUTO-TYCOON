<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPAN AUTO TYCOON — standalone prototype</title>
<style>body{font-family:system-ui;background:#112033;color:#eef5ff;max-width:700px;margin:auto;padding:20px}section{background:#22354b;border-radius:12px;padding:20px}button{padding:12px;margin:4px;border:0;border-radius:8px;background:#3879a3;color:white}</style></head>
<body><h1>JAPAN AUTO TYCOON</h1><p>単一HTMLの限定試作版（本番エンジンとは独立）</p><section><h2 id="date">1950年1月</h2><p>創業した自動車メーカーの経営開始。工学・製造・市場・会計は未実装。</p><div id="controls"><button data-months="1">1ヶ月進める</button><button data-months="3">3ヶ月</button><button data-months="6">6ヶ月</button><button data-months="12">12ヶ月</button></div><button id="save">保存</button><button id="load">読込</button><p id="notice" role="status"></p></section>
<script>
(function(){'use strict';let serial=1950*12;const date=document.querySelector('#date'),notice=document.querySelector('#notice');function render(){date.textContent=Math.floor(serial/12)+'年'+(serial%12+1)+'月';}document.querySelectorAll('[data-months]').forEach(b=>b.addEventListener('click',()=>{serial+=Number(b.dataset.months);render();}));document.querySelector('#save').addEventListener('click',()=>{try{localStorage.setItem('jat-proto-month',String(serial));notice.textContent='保存しました';}catch(e){notice.textContent='保存失敗: '+e.message;}});document.querySelector('#load').addEventListener('click',()=>{try{const value=localStorage.getItem('jat-proto-month');if(value!==null&&Number.isSafeInteger(Number(value))&&Number(value)>=0){serial=Number(value);render();notice.textContent='読み込みました';}else notice.textContent='有効な保存データなし';}catch(e){notice.textContent='読込失敗: '+e.message;}});render();})();
</script></body></html>
